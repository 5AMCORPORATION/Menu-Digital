<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUREUS | Soluciones Corporativas</title>
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ==========================================
       VARIABLES Y CONFIGURACIÓN CORPORATIVA
       ========================================== */
    :root {
      --bg-dark: #0A0D14;
      --surface-card: rgba(18, 24, 38, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 96, 57, 0.5);
      
      --primary: #006039;
      --primary-light: #00844F;
      --text-main: #F2F2F7;
      --text-muted: #8E8E93;
      
      --shadow-elevation: 0 20px 40px -15px rgba(0, 0, 0, 0.62);
      --shadow-glow: 0 0 25px rgba(0, 96, 57, 0.18);
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
    }

    /* ==========================================
       CONTENEDOR Y BARRA DE NAVEGACIÓN
       ========================================== */
    .navbar-container {
      width: 92%;
      max-width: 1200px;
      position: sticky;
      top: 1.5rem;
      z-index: 1000;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.75rem;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: var(--shadow-elevation);
      position: relative;
      overflow: hidden;
    }

    /* Destello superior de iluminación */
    .navbar::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      pointer-events: none;
    }

    /* ==========================================
       IDENTIDAD DE MARCA / LOGO
       ========================================== */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(0, 96, 57, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
    }

    .brand-dot {
      color: var(--primary-light);
    }

    /* ==========================================
       MENÚ DE NAVEGACIÓN
       ========================================== */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: var(--transition-smooth);
    }

    .nav-link i {
      width: 18px;
      height: 18px;
      opacity: 0.75;
      transition: var(--transition-smooth);
    }

    .nav-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .nav-link:hover i {
      opacity: 1;
      color: var(--primary-light);
    }

    .nav-link.active {
      color: #FFFFFF;
      background: rgba(0, 96, 57, 0.15);
      border-color: var(--border-active);
      box-shadow: var(--shadow-glow);
    }

    .nav-link.active i {
      opacity: 1;
      color: var(--primary-light);
    }

    /* ==========================================
       ACCIONES Y CONTACTO
       ========================================== */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .phone-contact {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      transition: var(--transition-smooth);
    }

    .phone-contact i {
      width: 16px;
      height: 16px;
      color: var(--primary-light);
    }

    .phone-contact:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    /* Destello sutil metálico al pasar el cursor */
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: rotate(25deg);
      transition: var(--transition-smooth);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(0, 96, 57, 0.4);
      transform: translateY(-1px);
    }

    .btn-primary:hover::after {
      left: 130%;
      transition: all 0.6s ease;
    }

    .btn-primary i {
      width: 16px;
      height: 16px;
      transition: var(--transition-smooth);
    }

    .btn-primary:hover i {
      transform: translateX(2px);
    }
  </style>
</head>
<body>

  <header class="navbar-container">
    <nav class="navbar">
      <!-- Identidad de Marca -->
      <a href="#" class="brand-logo">
        <div class="logo-icon">
          <i data-lucide="shield-check"></i>
        </div>
        <span class="brand-name">AUREUS<span class="brand-dot">.</span></span>
      </a>

      <!-- Menú de Navegación -->
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active">
            <i data-lucide="layout-dashboard"></i>
            <span>Inicio</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i data-lucide="briefcase"></i>
            <span>Servicios</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i data-lucide="bar-chart-3"></i>
            <span>Soluciones</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">
            <i data-lucide="users"></i>
            <span>Nosotros</span>
          </a>
        </li>
      </ul>

      <!-- Contacto Directo y CTA -->
      <div class="nav-actions">
        <a href="https://wa.me/525571953406" target="_blank" class="phone-contact" title="Contactar por WhatsApp">
          <i data-lucide="phone"></i>
          <span>55 7195 3406</span>
        </a>
        <a href="https://wa.me/525571953406" target="_blank" class="btn-primary">
          <span>Comenzar</span>
          <i data-lucide="arrow-right"></i>
        </a>
      </div>
    </nav>
  </header>

  <script>
    // Inicialización de iconos Lucide
    lucide.createIcons();
  </script>
</body>
</html>
